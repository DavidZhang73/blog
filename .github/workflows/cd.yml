name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          submodules: true
      - uses: actions/setup-node@main
        with:
          node-version: 20
      - uses: actions/cache@main
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy identical build to both origins
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TARGET: ${{ vars.TARGET }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SF_DEPLOY_HOST: ${{ vars.SF_DEPLOY_HOST }}
          SF_DEPLOY_USER: ${{ vars.SF_DEPLOY_USER }}
          SF_DEPLOY_PORT: ${{ vars.SF_DEPLOY_PORT }}
          SF_TARGET: ${{ vars.SF_TARGET }}
          SF_SSH_KNOWN_HOSTS: ${{ vars.SF_SSH_KNOWN_HOSTS }}
        run: python3 scripts/deploy_dual.py
      - name: Google ping sitemap
        run: |
          curl https://www.google.com/ping?sitemap=https://blog.davidz.cn/sitemap.xml
      - name: Baidu sitemap
        run: |
          curl -H 'Content-Type:text/plain' --data-binary @public/sitemap.txt "http://data.zz.baidu.com/urls?site=https://blog.davidz.cn&token=chvBQnYZ7wDH8kgu"
